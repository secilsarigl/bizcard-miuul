<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seçil Sarıgül — Dijital Kartvizit</title>
<style>
  :root{
    --bg-1:#0f172a;
    --bg-2:#1e293b;
    --accent:#38bdf8;
    --accent-2:#818cf8;
    --card-bg:#ffffff;
    --text-dark:#0f172a;
    --text-muted:#64748b;
    --radius:20px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:32px 16px;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:radial-gradient(circle at top left, var(--bg-2), var(--bg-1));
  }

  .card{
    width:100%;
    max-width:380px;
    background:var(--card-bg);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
  }

  .card-header{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    padding:36px 28px 64px;
    position:relative;
    text-align:center;
    color:#fff;
  }

  .card-header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:40px;
    background:var(--card-bg);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }

  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    margin:0 auto 14px;
    background:#fff;
    color:var(--accent-2);
    font-size:34px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    border:4px solid rgba(255,255,255,.6);
    letter-spacing:1px;
  }

  .card-header h1{
    margin:0 0 4px;
    font-size:22px;
    font-weight:700;
  }

  .card-header p{
    margin:0;
    font-size:14px;
    opacity:.9;
    font-weight:500;
  }

  .card-body{
    padding:28px 28px 28px;
    margin-top:-30px;
    position:relative;
  }

  .info-list{
    list-style:none;
    margin:0 0 24px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .info-list li{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:14px;
    color:var(--text-dark);
  }

  .info-list a{
    color:inherit;
    text-decoration:none;
    word-break:break-all;
  }

  .info-list a:hover{ color:var(--accent-2); }

  .icon{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:12px;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent-2);
  }

  .icon svg{ width:18px; height:18px; }

  .save-form{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:22px;
  }

  .actions{
    display:flex;
    gap:10px;
  }

  .form-field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .form-field label{
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
  }

  .form-field input{
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #e2e8f0;
    font-size:14px;
    font-family:inherit;
    color:var(--text-dark);
  }

  .form-field input:focus{
    outline:none;
    border-color:var(--accent-2);
    box-shadow:0 0 0 3px rgba(129,140,248,.15);
  }

  .btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 14px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }

  .btn-primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    box-shadow:0 8px 20px rgba(56,189,248,.35);
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:12px;
    padding-top:18px;
    border-top:1px solid #eef2f7;
  }

  .socials a{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#f1f5f9;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    transition:background .15s ease, color .15s ease;
  }

  .socials a:hover{
    background:var(--accent-2);
    color:#fff;
  }

  .socials svg{ width:17px; height:17px; }

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    opacity:.7;
    margin-top:18px;
  }

  .qr-panel{
    width:100%;
    max-width:380px;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    padding:20px;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .qr-panel.is-ready{ display:flex; }

  .contact-panel{
    width:100%;
    max-width:380px;
    margin-top:20px;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    padding:24px;
    text-align:center;
  }

  .contact-panel h2{
    margin:0 0 8px;
    font-size:16px;
    font-weight:700;
    color:var(--text-dark);
  }

  .contact-panel-desc{
    margin:0 0 16px;
    font-size:13px;
    color:var(--text-muted);
  }

  .contact-panel .btn{
    width:100%;
  }

  .consent-field label{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:12px;
    color:var(--text-muted);
    cursor:pointer;
  }

  .consent-field input[type="checkbox"]{
    margin-top:2px;
    flex:0 0 auto;
  }

  .link-btn{
    color:var(--accent-2);
    text-decoration:underline;
    background:none;
    border:none;
    padding:0;
    font:inherit;
    cursor:pointer;
  }

  .policy-link{
    display:block;
    margin:10px auto 0;
    font-size:11px;
    text-align:center;
  }

  .policy-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
  }

  .policy-panel{
    width:100%;
    max-width:560px;
    max-height:85vh;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:0 25px 60px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .policy-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:20px 24px;
    border-bottom:1px solid #eef2f7;
  }

  .policy-header h2{
    margin:0;
    font-size:16px;
    font-weight:700;
    color:var(--text-dark);
  }

  .policy-close{
    flex:0 0 auto;
    width:28px;
    height:28px;
    border-radius:50%;
    border:none;
    background:#f1f5f9;
    color:var(--text-muted);
    font-size:18px;
    line-height:1;
    cursor:pointer;
  }

  .policy-body{
    padding:20px 24px 28px;
    overflow-y:auto;
    font-size:13px;
    line-height:1.6;
    color:var(--text-dark);
  }

  .policy-body h3{ font-size:13px; margin:18px 0 6px; }
  .policy-body h3:first-child{ margin-top:0; }
  .policy-body p, .policy-body li{ margin:0 0 8px; }
  .policy-body ul{ margin:0 0 8px; padding-left:18px; }
</style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client"
    }
  }
  </script>
</head>
<body>

  <div id="root"></div>

  <div class="qr-panel">
    <div id="qr-slot"></div>
  </div>

  <!-- Kurulum gerektirmez: React + Babel CDN üzerinden yüklenir -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const PROFILE = {
      initials: "SS",
      name: "Seçil Sarıgül",
      title: "Computer Vision Mühendisi",
      phone: "+90 543 854 31 38",
      phoneHref: "+905438543138",
      email: "secil.sarigl@gmail.com",
      tagline: "BizCard projesi kapsamında geliştirildi",
      socials: [
        { label: "LinkedIn", href: "https://www.linkedin.com/in/secil-sarigul/", icon: "linkedin" },
        { label: "GitHub", href: "https://github.com/secilsarigl", icon: "github" },
      ],
    };

    // --- İkonlar -----------------------------------------------------

    function PhoneIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z" />
        </svg>
      );
    }

    function MailIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 6 12 13 2 6" />
          <rect x="2" y="4" width="20" height="16" rx="2" />
        </svg>
      );
    }

    function PlusIcon() {
      return (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      );
    }

    function CalendarIcon() {
      return (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
      );
    }

    function ContactAddIcon() {
      return (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <line x1="19" y1="8" x2="19" y2="14" />
          <line x1="22" y1="11" x2="16" y2="11" />
        </svg>
      );
    }

    function LinkedInIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.25h4V23h-4V8.25zM8.5 8.25h3.83v2.02h.05c.53-1 1.85-2.05 3.8-2.05 4.06 0 4.82 2.67 4.82 6.14V23h-4v-6.72c0-1.6-.03-3.66-2.23-3.66-2.24 0-2.58 1.75-2.58 3.55V23h-4V8.25z" />
        </svg>
      );
    }

    function GitHubIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.75 2.69 1.25 3.34.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.43-2.7 5.4-5.27 5.69.42.36.78 1.08.78 2.18 0 1.57-.01 2.84-.01 3.23 0 .3.21.66.79.55A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" />
        </svg>
      );
    }

    const SOCIAL_ICONS = { linkedin: LinkedInIcon, github: GitHubIcon };

    // --- Bileşenler ----------------------------------------------------

    function Avatar({ initials, name, title }) {
      return (
        <div className="card-header">
          <div className="avatar">{initials}</div>
          <h1>{name}</h1>
          <p>{title}</p>
        </div>
      );
    }

    function ContactList({ phone, phoneHref, email }) {
      const items = [
        { icon: <PhoneIcon />, content: <a href={`tel:${phoneHref}`}>{phone}</a> },
        { icon: <MailIcon />, content: <a href={`mailto:${email}`}>{email}</a> },
      ];

      return (
        <ul className="info-list">
          {items.map((item, i) => (
            <li key={i}>
              <span className="icon">{item.icon}</span>
              {item.content}
            </li>
          ))}
        </ul>
      );
    }

    function SocialLinks({ socials }) {
      return (
        <div className="socials">
          {socials.map((s) => {
            const Icon = SOCIAL_ICONS[s.icon];
            return (
              <a key={s.label} href={s.href} aria-label={s.label} target="_blank" rel="noopener noreferrer">
                <Icon />
              </a>
            );
          })}
        </div>
      );
    }

    function buildVCard(profile) {
      const [lastName, ...rest] = profile.name.split(" ");
      const firstName = rest.join(" ");
      return [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${lastName};${firstName};;;`,
        `FN:${profile.name}`,
        `TITLE:${profile.title}`,
        `TEL;TYPE=CELL:${profile.phoneHref}`,
        `EMAIL:${profile.email}`,
        "END:VCARD",
      ].join("\r\n");
    }

    function downloadVCard(profile) {
      const blob = new Blob([buildVCard(profile)], { type: "text/vcard" });
      const url = URL.createObjectURL(blob);
      const fileName = profile.name.trim().toLowerCase().replace(/\s+/g, "-") + ".vcf";

      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function todayDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function CardActionsForm({ profile, onOpenPolicy }) {
      const [isSubmitting, setIsSubmitting] = React.useState(false);
      const isSubmittingRef = React.useRef(false);

      function handleSubmit(event) {
        event.preventDefault();

        if (isSubmittingRef.current) return;

        const form = event.target;
        const action = event.nativeEvent.submitter.value;
        const dateField = form.elements.preferredDate;

        if (action === "meeting" && !dateField.value) {
          dateField.setCustomValidity("Lütfen toplantı için bir tarih seçin.");
          dateField.reportValidity();
          return;
        }
        dateField.setCustomValidity("");

        const formData = new FormData(form);
        const visitorName = formData.get("visitorName").trim();
        const visitorEmail = formData.get("visitorEmail").trim();
        const preferredDate = formData.get("preferredDate");

        isSubmittingRef.current = true;
        setIsSubmitting(true);

        if (action === "save") {
          downloadVCard(profile);

          console.log({
            event: "card.save",
            timestamp: new Date().toISOString(),
            payload: {
              card: {
                name: profile.name,
                title: profile.title,
                phone: profile.phoneHref,
                email: profile.email,
              },
              source: {
                userAgent: navigator.userAgent,
                referrer: document.referrer || null,
              },
              savedBy: {
                name: visitorName,
                email: visitorEmail,
              },
            },
          });
        } else {
          console.log({
            event: "meeting.request",
            timestamp: new Date().toISOString(),
            payload: {
              requester: {
                name: visitorName,
                email: visitorEmail,
                phone: null,
              },
              message: null,
              preferredDate,
              cardOwner: {
                name: profile.name,
                email: profile.email,
              },
            },
          });
        }

        form.reset();

        // Buton kısa süre devre dışı kalır; hızlı art arda tıklamalarda
        // ikinci gönderim engellenir. Gerçek webhook eklendiğinde bu
        // gecikme yerine fetch'in tamamlanmasını beklemeye geçilecek.
        window.setTimeout(() => {
          isSubmittingRef.current = false;
          setIsSubmitting(false);
        }, 800);
      }

      return (
        <form className="save-form" onSubmit={handleSubmit}>
          <div className="form-field">
            <label htmlFor="visitorName">Adınız</label>
            <input id="visitorName" name="visitorName" type="text" required />
          </div>
          <div className="form-field">
            <label htmlFor="visitorEmail">E-posta adresiniz</label>
            <input id="visitorEmail" name="visitorEmail" type="email" required />
          </div>
          <div className="form-field">
            <label htmlFor="preferredDate">Tercih ettiğiniz tarih (toplantı için)</label>
            <input
              id="preferredDate"
              name="preferredDate"
              type="date"
              min={todayDateString()}
              onInput={(event) => event.target.setCustomValidity("")}
            />
          </div>
          <div className="form-field consent-field">
            <label>
              <input name="consent" type="checkbox" required />
              <span>
                <button
                  type="button"
                  className="link-btn"
                  onClick={(event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    onOpenPolicy();
                  }}
                >
                  Gizlilik Politikası
                </button>
                'nı okudum, kişisel
                verilerimin işlenmesini kabul ediyorum.
              </span>
            </label>
          </div>
          <div className="actions">
            <button type="submit" name="action" value="save" className="btn btn-primary" disabled={isSubmitting}>
              <PlusIcon />
              Kartı Kaydet
            </button>
            <button type="submit" name="action" value="meeting" className="btn btn-primary" disabled={isSubmitting}>
              <CalendarIcon />
              Toplantı Talep Et
            </button>
          </div>
        </form>
      );
    }

    function AddToContactsPanel({ profile }) {
      function handleAddToContacts() {
        downloadVCard(profile);
      }

      return (
        <div className="contact-panel">
          <h2>Kartviziti Telefonuma Ekle</h2>
          <p className="contact-panel-desc">
            {profile.name} kişisini tek tıkla rehberine ekle.
          </p>
          <button type="button" className="btn btn-primary" onClick={handleAddToContacts}>
            <ContactAddIcon />
            Telefonuma Ekle
          </button>
          <p className="footer-note">Ad, e-posta ve telefon rehberine kaydedilecek.</p>
        </div>
      );
    }

    function PrivacyPolicyModal({ isOpen, onClose }) {
      if (!isOpen) return null;

      return (
        <div className="policy-overlay" onClick={onClose}>
          <div className="policy-panel" onClick={(event) => event.stopPropagation()}>
            <div className="policy-header">
              <h2>Gizlilik Politikası ve Kişisel Verilerin Korunmasına İlişkin Aydınlatma Metni</h2>
              <button type="button" className="policy-close" onClick={onClose} aria-label="Kapat">×</button>
            </div>
            <div className="policy-body">
              <p><strong>Son güncelleme:</strong> 25.08.2026</p>

              <h3>1. Veri Sorumlusu</h3>
              <p>
                Bu dijital kartvizit uygulaması Seçil Sarıgül tarafından, 6698 sayılı Kişisel Verilerin
                Korunması Kanunu ("KVKK") ve Avrupa Birliği Genel Veri Koruma Tüzüğü ("GDPR") kapsamında
                veri sorumlusu sıfatıyla işletilmektedir. İletişim: secil.sarigl@gmail.com
              </p>

              <h3>2. Toplanan Kişisel Veriler</h3>
              <ul>
                <li>
                  "Kartı Kaydet" ve "Toplantı Talep Et" formu: ad soyad, e-posta adresi ve (toplantı
                  talebinde) tercih edilen tarih.
                </li>
                <li>
                  Otomatik olarak toplanan teknik veriler: tarayıcı bilgisi (user agent) ve yönlendiren
                  sayfa adresi (referrer).
                </li>
                <li>
                  "Telefonuma Ekle" özelliği kart sahibinin bilgilerini (ad, e-posta, telefon) bir .vcf
                  dosyası olarak doğrudan cihazınıza indirir; bu işlem tamamen tarayıcınızda gerçekleşir,
                  hiçbir veri sunucuya gönderilmez ve bu adımda ziyaretçiye ait herhangi bir kişisel veri
                  toplanmaz.
                </li>
              </ul>

              <h3>3. İşleme Amaçları</h3>
              <p>
                Kişisel verileriniz; kartvizit kaydetme talebinizi ve toplantı talebinizi işleme almak,
                talebinizle ilgili sizinle iletişime geçmek amacıyla işlenir.
              </p>

              <h3>4. Hukuki Sebep</h3>
              <p>
                Veriler, formu göndermeden önce işaretlediğiniz onay kutusuyla verdiğiniz açık rızaya
                dayanılarak (KVKK m. 5/1; GDPR m. 6/1-a) işlenmektedir.
              </p>

              <h3>5. Verilerin Aktarımı</h3>
              <p>
                Bu proje şu an bir demo/portföy çalışmasıdır: form gönderiminde toplanan veriler yalnızca
                tarayıcı konsoluna kaydedilmekte olup üçüncü bir sunucuya veya hizmete aktarılmamaktadır.
                İleride bir backend/webhook entegrasyonu devreye alındığında bu politika güncellenecek ve
                aktarım burada açıkça belirtilecektir.
              </p>

              <h3>6. Saklama Süresi</h3>
              <p>
                Verileriniz, talebinizin işlenmesi ve olası iletişim için gereken süre boyunca saklanır;
                bu süre sonunda silinir veya anonim hale getirilir.
              </p>

              <h3>7. Haklarınız</h3>
              <p>KVKK m. 11 ve GDPR m. 15-22 uyarınca aşağıdaki haklara sahipsiniz:</p>
              <ul>
                <li>Kişisel verinizin işlenip işlenmediğini öğrenme ve işlenmişse buna ilişkin bilgi talep etme,</li>
                <li>İşlenme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme,</li>
                <li>Yurt içinde/dışında aktarıldığı üçüncü kişileri bilme,</li>
                <li>Eksik veya yanlış işlenmişse düzeltilmesini isteme,</li>
                <li>Silinmesini veya yok edilmesini isteme ("unutulma hakkı"),</li>
                <li>Düzeltme/silme taleplerinin aktarıldığı üçüncü kişilere bildirilmesini isteme,</li>
                <li>Otomatik sistemlerle yapılan analiz sonucu aleyhinize bir sonucun ortaya çıkmasına itiraz etme,</li>
                <li>Kanuna aykırı işleme nedeniyle zarara uğramanız hâlinde zararın giderilmesini talep etme,</li>
                <li>
                  (GDPR) Verilerinizin taşınabilirliğini talep etme, rızanızı istediğiniz zaman geri
                  çekme ve bir denetim otoritesine şikâyette bulunma.
                </li>
              </ul>

              <h3>8. Çerezler</h3>
              <p>Bu uygulama çerez veya benzeri izleme teknolojileri kullanmamaktadır.</p>

              <h3>9. Başvuru</h3>
              <p>
                Yukarıdaki haklarınızı kullanmak için secil.sarigl@gmail.com adresinden bizimle
                iletişime geçebilirsiniz.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function ProfilCard({ profile, onOpenPolicy }) {
      return (
        <div className="card">
          <Avatar initials={profile.initials} name={profile.name} title={profile.title} />

          <div className="card-body">
            <ContactList
              phone={profile.phone}
              phoneHref={profile.phoneHref}
              email={profile.email}
            />

            <CardActionsForm profile={profile} onOpenPolicy={onOpenPolicy} />

            <SocialLinks socials={profile.socials} />

            {profile.tagline && <p className="footer-note">{profile.tagline}</p>}

            <button type="button" className="link-btn policy-link" onClick={onOpenPolicy}>
              Gizlilik Politikası
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [isPolicyOpen, setIsPolicyOpen] = React.useState(false);

      return (
        <>
          <ProfilCard profile={PROFILE} onOpenPolicy={() => setIsPolicyOpen(true)} />
          <AddToContactsPanel profile={PROFILE} />
          <PrivacyPolicyModal isOpen={isPolicyOpen} onClose={() => setIsPolicyOpen(false)} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { QRCodeSVG } from "https://esm.sh/qrcode.react@4?external=react,react-dom";

    const LIVE_URL = "https://bizcard-miuul-chi.vercel.app/";
    const slot = document.getElementById("qr-slot");

    if (slot) {
      createRoot(slot).render(React.createElement(QRCodeSVG, { value: LIVE_URL, size: 150 }));
      slot.parentElement.classList.add("is-ready");
    }
  </script>
